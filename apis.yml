name: Aerodome
description: >-
  Aerodome was a Drone-as-First-Responder (DFR) company founded in 2023 by former
  California police officer Rahul Sidhu (CEO) and Kenaniah Cerny (Chief Architect).
  It built a fully integrated, automated, and remotely operated software platform
  that let public-safety agencies dispatch autonomous drones directly from 911 calls,
  pairing DJI drone hardware, robotic battery-swap docking nests, and radar with
  Aerodome DFR software featuring augmented-reality street overlays, automated flight
  operations, computer-aided-dispatch integration, and live airspace awareness. The
  company reported average 86-second response times to 911 calls. Backed by a16z, CRV,
  and 2048 Ventures across a seed (Oct 2023) and $21.5M Series A (May 2024), Aerodome
  was acquired by Flock Safety in October 2024 for over $300 million; its technology
  and software now ship as the Flock Safety "Flock DFR" product line, and the
  aerodome.com domain redirects to that product page.
